[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Martin Lau",     email = "martin.lau@hec.edu" },
  { name = "Julian Fix",     email = "julian.fix@hec.edu" },
  { name = "Scott Mayette",  email = "scott.mayette@hec.edu" },
  { name = "Yuqi Xin",       email = "yuqi.xin@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.10,<3.12"

dependencies = [
  "pydantic>=2.0",
  "pre-commit>=3.0",
  "ruff>=0.9.0",
  "pandas>=2.3.3",
  "numpy>=2.2.6",
  "matplotlib>=3.10.9",
  "seaborn>=0.13.2",
  "ipykernel>=7.3.0",
  "mlflow>=3.17.2",
  "scikit-learn>=1.7.2",
  "prefect>=3.8.8",
  "sqlalchemy>=2.0,<2.1",
]

[tool.uv]
package = false
